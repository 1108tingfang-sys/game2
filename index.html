<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小小夢魔：理財城逃脫</title><script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#18234e;color:#192052;font-family:"Microsoft JhengHei",system-ui,sans-serif;overflow:hidden}#game{width:100vw;height:100vh;display:block;background:#75c9f0}#hud{position:fixed;inset:0;pointer-events:none;padding:16px;display:flex;justify-content:space-between;align-items:flex-start}.card{background:#fff9eaf2;border:3px solid white;border-radius:18px;padding:11px 15px;box-shadow:0 7px #a96757;font-weight:800}.title{font-size:clamp(18px,3vw,27px)}#tip{position:fixed;bottom:18px;left:50%;translate:-50%;background:#17234de8;color:#fff;padding:12px 18px;border-radius:99px;font-weight:800;opacity:0;transition:.2s}.show{opacity:1!important}#pig{position:fixed;right:18px;bottom:16px;width:190px;height:210px;background:#fff8;border:3px solid #fff;border-radius:22px;box-shadow:0 7px #a96757}#piglabel{position:fixed;right:38px;bottom:190px;background:#fff4b0;border-radius:99px;padding:6px 10px;font-weight:800}.modal{display:none;position:fixed;inset:0;background:#111a39aa;place-items:center;padding:16px}.modal.show{display:grid}.panel{width:min(610px,100%);background:#fff8e8;border:5px solid #fff;border-radius:27px;padding:24px;box-shadow:0 15px #a96757}.tag{background:#61b7e8;color:#fff;padding:6px 11px;border-radius:99px;font-weight:900}h2{margin:12px 0 7px}p{font-size:18px;line-height:1.65}.answers{display:grid;gap:9px}.answers button,#again{font:inherit;font-weight:800;text-align:left;padding:13px;border:3px solid #e4ba7c;border-radius:13px;background:#fff;color:#192052;cursor:pointer}.answers button:hover,#again:hover{background:#fff0ad}.good{color:#107442;font-weight:900}.bad{color:#bb3557;font-weight:900}@media(max-width:650px){#pig{width:120px;height:135px;bottom:10px;right:10px}#piglabel{right:12px;bottom:130px;font-size:12px}.card{padding:8px;font-size:13px}.title{font-size:17px}}
</style></head><body><canvas id="game"></canvas><div id="hud"><div class="card"><div class="title">小小夢魔：理財城逃脫</div><span id="goal">第 1 關：走到雨傘攤解題</span></div><div class="card" id="score">得分：0／100<br>KEY：0／2</div></div><div id="tip">按 <b>E</b> 解題　・　WASD／方向鍵移動</div><div id="piglabel">Blender 製作的小豬嚮導</div><model-viewer id="pig" src="./money_guide.glb" camera-controls auto-rotate shadow-intensity="1" exposure="1.1" alt="小豬理財嚮導 3D 模型"></model-viewer><div class="modal" id="modal"><div class="panel"><span class="tag" id="tag"></span><h2 id="head"></h2><p id="q"></p><div class="answers" id="answers"></div><p id="feedback"></p></div></div>
<script>
const c=document.querySelector('#game'),x=c.getContext('2d'),$=s=>document.querySelector(s);let W,H,player={x:0,y:0},state={level:1,score:0,keys:0,tries:0,modal:false},keys={};const stations=[{x:-.56,y:.08,name:'雨傘攤',color:'#58a8ed',q:'你有 100 金幣。上學需要的雨傘壞了，要花 60 金幣；你也很想買 120 金幣的遊戲機。先做哪一件事？',a:[['先買雨傘（需要）',1],['先買遊戲機（想要）',0],['兩樣都買，之後再想辦法',0]],tip:'生活需要不足時，會影響上學和安全。'},{x:.45,y:-.6,name:'金幣花園',color:'#69c984',q:'你有 100 金幣。哪個計畫同時照顧日常需要、儲蓄與未來成長？',a:[['全部花在零食與玩具',0],['40 需要＋40 儲蓄＋20 學習成長',1],['全部投入，完全不留日常需要',0]],tip:'先照顧需要與儲蓄；投資不保證獲利。'}];function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
function pos(p){return[(p.x+1)*innerWidth/2,(1-p.y)*innerHeight/2]}function draw(){x.clearRect(0,0,innerWidth,innerHeight);let g=x.createLinearGradient(0,0,0,innerHeight);g.addColorStop(0,'#74c9f0');g.addColorStop(.42,'#ffe0a5');g.addColorStop(.421,'#e9c487');x.fillStyle=g;x.fillRect(0,0,innerWidth,innerHeight);x.fillStyle='#765050';x.fillRect(0,innerHeight*.19,innerWidth,innerHeight*.05);for(let i=0;i<10;i++){x.fillStyle=i%2?'#ef985f':'#6279b9';x.fillRect(i*innerWidth/10,innerHeight*.1,innerWidth/13,innerHeight*.1)}let d=pos({x:0,y:-.12});x.fillStyle=state.keys?'#4faa76':'#955238';x.beginPath();x.arc(d[0],d[1],Math.min(W,H)/9,Math.PI,0);x.lineTo(d[0]+Math.min(W,H)/9,d[1]+Math.min(W,H)/6);x.lineTo(d[0]-Math.min(W,H)/9,d[1]+Math.min(W,H)/6);x.fill();x.fillStyle='#ffd657';x.font='38px sans-serif';x.fillText(state.keys?'🔓':'🔒',d[0]-20,d[1]+35);stations.forEach((s,i)=>{let p=pos(s);x.fillStyle=s.color;x.beginPath();x.arc(p[0],p[1],43,0,7);x.fill();x.font='39px sans-serif';x.fillText(i?'🌱':'☂️',p[0]-20,p[1]+14);x.fillStyle='#fff';x.font='bold 16px Microsoft JhengHei';x.fillText(s.name,p[0]-43,p[1]-53);if(state.keys>i){x.font='35px sans-serif';x.fillText('🔑',p[0]+33,p[1]-30)}});let p=pos(player);x.fillStyle='#315fa8';x.beginPath();x.arc(p[0],p[1],22,0,7);x.fill();x.fillStyle='#ff8b3f';x.fillRect(p[0]-11,p[1]-4,22,25);x.fillStyle='#fff';x.font='bold 15px Microsoft JhengHei';x.fillText('你',p[0]-10,p[1]+5);requestAnimationFrame(draw)}draw();
function hud(){$('#score').innerHTML=`得分：${state.score}／100<br>KEY：${state.keys}／2`;$('#goal').textContent=state.level===1?'第 1 關：走到雨傘攤解題':'第 2 關：穿過大門，走到金幣花園解題'}function near(){let s=stations[state.level-1],dx=player.x-s.x,dy=player.y-s.y;return Math.hypot(dx,dy)<.16}function dialog(){let s=stations[state.level-1];state.modal=true;$('#tag').textContent='第 '+state.level+' 關';$('#head').textContent=s.name+'：'+(state.level===1?'需要還是想要？':'金幣怎麼分配？');$('#q').textContent=s.q;$('#feedback').textContent='';$('#answers').innerHTML='';s.a.forEach(a=>{let b=document.createElement('button');b.textContent=a[0];b.onclick=()=>answer(a[1],s.tip);$('#answers').append(b)});$('#modal').classList.add('show')}function answer(ok,tip){state.tries++;if(!ok){$('#feedback').className='bad';$('#feedback').textContent=tip;return}state.score+=50;state.keys++;hud();$('#feedback').className='good';$('#feedback').textContent='答對了！取得 KEY，新的道路開啟。';setTimeout(()=>{if(state.level===1){state.level=2;state.modal=false;$('#modal').classList.remove('show');hud()}else end()},850)}function end(){state.modal=true;$('#tag').textContent='任務完成';$('#head').textContent='理財城大門開啟！';$('#q').innerHTML=`✓ 能分辨需要與想要<br>✓ 能安排日常需要與儲蓄<br>✓ 了解量力而為的成長規劃<br><br><b>得分：${state.score}／100　嘗試：${state.tries} 次</b>`;$('#answers').innerHTML='<button id="again">再玩一次</button>';$('#again').onclick=()=>location.reload();$('#modal').classList.add('show')}addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='e'&&near()&&!state.modal)dialog()});addEventListener('keyup',e=>delete keys[e.key.toLowerCase()]);setInterval(()=>{if(!state.modal){let v=.025;if(keys.w||keys.arrowup)player.y+=v;if(keys.s||keys.arrowdown)player.y-=v;if(keys.a||keys.arrowleft)player.x-=v;if(keys.d||keys.arrowright)player.x+=v;player.x=Math.max(-.9,Math.min(.9,player.x));player.y=Math.max(-.85,Math.min(.75,player.y));if(state.level===1&&player.y<-.04)player.y=-.04}$('#tip').classList.toggle('show',near()&&!state.modal)},30);hud();
</script></body></html>
